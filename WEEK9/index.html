<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Diet RAG Chatbot</title>
    <!-- Include React and ReactDOM from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Include Babel for JSX support in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; height: 650px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .chat-header { background: #0f172a; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #334155; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 85%; line-height: 1.5; word-wrap: break-word; }
        .user-message { background: #3b82f6; align-self: flex-end; color: white; }
        .bot-message { background: #334155; align-self: flex-start; color: #f8fafc; }
        .bot-message ul { margin: 5px 0; padding-left: 20px; }
        .bot-message li { margin-bottom: 4px; }
        .chat-input-area { display: flex; padding: 10px; background: #0f172a; border-top: 1px solid #334155; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: white; outline: none; }
        .chat-input-area button { background: #3b82f6; color: white; border: none; padding: 10px 16px; margin-left: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        function ChatApp() {
            const [messages, setMessages] = React.useState([
                { sender: 'bot', text: 'Hello! Ask me anything about planning your diabetes diet.' }
            ]);
            const [input, setInput] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const messagesEndRef = React.useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            React.useEffect(scrollToBottom, [messages, loading]);

            const sendMessage = async () => {
                if (!input.trim() || loading) return;

                const userText = input.trim();
                setInput('');
                setMessages(prev => [...prev, { sender: 'user', text: userText }]);
                setLoading(true);

                try {
                    const response = await fetch(`http://127.0.0.1:8000/ask?question=${encodeURIComponent(userText)}`);
                    const data = await response.json();
                    setMessages(prev => [...prev, { sender: 'bot', text: data.answer || "I don't know." }]);
                } catch (error) {
                    setMessages(prev => [...prev, { sender: 'bot', text: 'Error connecting to backend server.' }]);
                } finally {
                    setLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') sendMessage();
            };

            // Enhanced parser to clean up markdown headers (###), bold tags (**), and bullet points (*)
            const renderFormattedText = (text) => {
                let cleanText = text
                    .replace(/^###\s+(.*$)/gm, '<h4 style="margin: 8px 0 4px 0; color: #60a5fa;">$1</h4>') // Convert ### to styled subheadings
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/^\* (.*$)/gm, '<li>$1</li>');             // Bullet points

                if (cleanText.includes('<li>')) {
                    cleanText = '<ul>' + cleanText.replace(/<li><\/li>/g, '') + '</ul>';
                }

                return <div dangerouslySetInnerHTML={{ __html: cleanText.replace(/\n/g, '<br/>') }} />;
            };

            return (
                <div className="chat-container">
                    <div className="chat-header">Diabetes Diet Assistant</div>
                    <div className="chat-messages">
                        {messages.map((msg, index) => (
                            <div key={index} className={`message ${msg.sender === 'user' ? 'user-message' : 'bot-message'}`}>
                                {msg.sender === 'bot' ? renderFormattedText(msg.text) : msg.text}
                            </div>
                        ))}
                        {loading && <div className="message bot-message">Thinking...</div>}
                        <div ref={messagesEndRef} />
                    </div>
                    <div className="chat-input-area">
                        <input 
                            type="text" 
                            value={input} 
                            onChange={(e) => setInput(e.target.value)} 
                            onKeyDown={handleKeyDown} 
                            placeholder="Type a question..." 
                        />
                        <button onClick={sendMessage}>Send</button>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<ChatApp />);
    </script>
</body>
</html>
