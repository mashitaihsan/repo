<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My World</title>
    <script>
      let myArray = [4, 5, 6, 10, 12];
      let total = 0;

      for (let i = 0; i < myArray.length; i++) {
        total += myArray[i];
      }
      console.log(total);
    </script>
  </head>
  <body>
    <h1>My forloop World</h1>
  </body>
</html>
